name: Register-Concert-Kubernetes-Environment
platform: node
blocks:
  # Registers a RIA k3s cluster in Concert the same way the Concert UI's
  # "Discover your data" wizard does (reverse-engineered from the Concert
  # 3.0.1.1 UI bundle, see optimized-solution docs/superpowers/specs/
  # 2026-09-30-environment-type-design.md):
  #   credential (kubernetes) -> environment (name = deployment_id, purpose
  #   from environment_type) -> POST /core/api/v1/k8_components with the app
  #   namespace, application "<app>-<env>" and Trivy image scanning (discovery
  #   creates/reuses the application) -> application criticality from
  #   environment_type once the application exists.
  # The old POST /ingestion_jobs + collect_data pair never sent namespaces or
  # an application, which is what made Concert's SBOM step fail with
  # "deployment name cannot be empty" - not a k3s limitation.
  # profile_name (resilience profile) is required by discovery's kube metrics
  # and misconfig scan modules - without it they abort with KeyError 'profile'
  # (live-confirmed); "profile" is rejected as unknown field, "profile_name" works.
  # Names must stay [a-z0-9-]: discovery derives a profile name from
  # environment, namespace and application names and rejects spaces and
  # parentheses (live-confirmed: "Invalid Profile name '..._(Kubernetes)_...'").
  # Expression rules (all live-confirmed earlier): bare $var only inside
  # headers/body; jq nodes are named extract_* and assign-ed into plain vars.
  # A non-2xx HTTP response does not abort the flow - the "already exists"
  # paths below rely on that.
  - action: switch
    name: map_environment_type
    expression: $environment_type
    cases:
      - value: '"PROD"'
        blocks:
          - action: assign
            name: set_purpose_prod
            variable: $purpose
            value: '"Production"'
          - action: assign
            name: set_criticality_prod
            variable: $criticality
            value: "5"
      - value: '"STAGE"'
        blocks:
          - action: assign
            name: set_purpose_stage
            variable: $purpose
            value: '"Staging"'
          - action: assign
            name: set_criticality_stage
            variable: $criticality
            value: "4"
      - value: '"INT"'
        blocks:
          - action: assign
            name: set_purpose_int
            variable: $purpose
            value: '"Testing"'
          - action: assign
            name: set_criticality_int
            variable: $criticality
            value: "3"
    default:
      - action: assign
        name: set_purpose_dev
        variable: $purpose
        value: '"Development"'
      - action: assign
        name: set_criticality_dev
        variable: $criticality
        value: "2"
  - action: assign
    name: build_auth_header
    variable: $auth_header
    value: '"C_API_KEY " + $concert_api_key'
  - action: assign
    name: build_application_name
    variable: $application_name
    value: '($app_name + "-" + $environment_type).toLowerCase()'
  # The description prefix "RIA demo environment" is the marker the hourly
  # Cleanup_HCP_Terraform_Workspace reconcile uses - do not change it.
  - action: assign
    name: build_environment_description
    variable: $environment_description
    value: '"RIA demo environment (" + $deployment_id + " / " + $application_name + ")"'
  - action: assign
    name: build_discovery_job_name
    variable: $discovery_job_name
    value: '"discovery-" + $deployment_id'
  - action: system/Common/HTTP/HTTP Request
    name: CreateConnection
    inputs:
      - name: method
        value: '"POST"'
      - name: host
        value: $concert_core_url + "/concert/core/api/v1/credentials"
      - name: headers
        value: |-
          {
              "Content-Type": "application/json",
              "InstanceId": "0000-0000-0000-0000",
              "Authorization": $auth_header
          }
      - name: body
        value: |-
          {
              "name": $deployment_id,
              "description": $environment_description,
              "type": "kubernetes",
              "credentials": [
                  { "key": "endpoint", "value": $k3s_endpoint },
                  { "key": "server_validation_enabled", "value": "false" },
                  { "key": "token", "value": $k3s_token }
              ]
          }
  - action: system/Common/JSON/jq
    name: extract_connection_id
    inputs:
      - name: JSON
        value: $CreateConnection.result
      - name: Filter
        value: '".id // empty"'
  - action: assign
    name: set_connection_id_from_create
    variable: $connection_id
    value: $extract_connection_id.result
  - action: if
    name: connection_already_existed
    condition: $connection_id == "" || $connection_id == null
    then:
      - action: system/Common/HTTP/HTTP Request
        name: ListConnections
        inputs:
          - name: method
            value: '"GET"'
          - name: host
            value: $concert_core_url + "/concert/core/api/v1/credentials"
          - name: headers
            value: |-
              {
                  "InstanceId": "0000-0000-0000-0000",
                  "Authorization": $auth_header
              }
      - action: system/Common/JSON/jq
        name: extract_existing_connection_id
        inputs:
          - name: JSON
            value: $ListConnections.result
          - name: Filter
            value: '".credentials[] | select(.name==\"" + $deployment_id + "\") | .id"'
      - action: assign
        name: set_connection_id_from_lookup
        variable: $connection_id
        value: $extract_existing_connection_id.result
    else: []
  # purpose can only be set at creation (environment PATCH covers only
  # description/tags), so the environment is created here and discovery is
  # pointed at it by name.
  - action: system/Common/HTTP/HTTP Request
    name: CreateEnvironment
    inputs:
      - name: method
        value: '"POST"'
      - name: host
        value: $concert_core_url + "/concert/core/api/v1/environments"
      - name: headers
        value: |-
          {
              "Content-Type": "application/json",
              "InstanceId": "0000-0000-0000-0000",
              "Authorization": $auth_header
          }
      - name: body
        value: |-
          {
              "name": $deployment_id,
              "description": $environment_description,
              "tags": [],
              "type": "kubernetes",
              "purpose": $purpose
          }
  - action: system/Common/HTTP/HTTP Request
    name: DiscoverCluster
    inputs:
      - name: method
        value: '"POST"'
      - name: host
        value: $concert_core_url + "/concert/core/api/v1/k8_components"
      - name: headers
        value: |-
          {
              "Content-Type": "application/json",
              "InstanceId": "0000-0000-0000-0000",
              "Authorization": $auth_header
          }
      - name: body
        value: |-
          {
              "type": "kubernetes",
              "credentials_id": $connection_id,
              "discovery_job_name": $discovery_job_name,
              "disable_trivy_scan": false,
              "assessment_period": "hour",
              "environment": $deployment_id,
              "ingestion_details": {
                  "parameters": [ { "key": "cluster_name", "value": $cluster_name } ]
              },
              "namespaces": [
                  {
                      "application_name": $application_name,
                      "namespace": $app_namespace,
                      "version": "1.0.0",
                      "label": "",
                      "cluster_name": $cluster_name,
                      "profile_name": $resilience_profile
                  }
              ],
              "clusters": [ { "name": $cluster_name, "namespaces": [ $app_namespace ] } ]
          }
  - action: system/Common/JSON/jq
    name: extract_discovery_job_id
    inputs:
      - name: JSON
        value: $DiscoverCluster.result
      - name: Filter
        value: '".discovery_job_id // empty"'
  - action: assign
    name: set_discovery_job_id
    variable: $discovery_job_id
    value: $extract_discovery_job_id.result
  # The discovery job creates the application "<app>-<env>" itself (Concert
  # 3.0.1.1 UI never uses POST /core/api/v1/applications any more - that legacy
  # 2.x path fails on a 3.0.1.1 schema). The job runs asynchronously, so poll
  # the lookup until the application exists (live: ~15-30 s), then set its
  # criticality. A timeout only skips the criticality step - the environment
  # and the discovery itself are already in place.
  - action: assign
    name: set_app_wait_start
    variable: $app_wait_start
    value: Date.now()
  - action: while
    name: WaitForApplication
    condition: ($application_id == "" || $application_id == null) && (Date.now() - $app_wait_start < $app_wait_seconds * 1000)
    blocks:
      - action: system/Common/Sleep
        name: SleepBeforeLookup
        inputs:
          - name: seconds
            value: "15"
      - action: system/Common/HTTP/HTTP Request
        name: LookupApplication
        inputs:
          - name: method
            value: '"POST"'
          - name: host
            value: $concert_core_url + "/concert/core/api/v2/lookup_applications"
          - name: headers
            value: |-
              {
                  "Content-Type": "application/json",
                  "InstanceId": "0000-0000-0000-0000",
                  "Authorization": $auth_header
              }
          - name: body
            value: |-
              {
                  "application_names": [ $application_name ]
              }
      - action: system/Common/JSON/jq
        name: extract_application_id
        inputs:
          - name: JSON
            value: $LookupApplication.result
          - name: Filter
            value: '".applications[0].id // empty"'
      - action: assign
        name: set_application_id
        variable: $application_id
        value: $extract_application_id.result
  # Criticality + data impact risk feed Concert's risk score (environmental
  # factor): PROD 5, STAGE 4, INT 3, DEV 2 - purpose alone does not. The API
  # field is data_impact_risk (data_sensitivity is rejected: live 400).
  - action: if
    name: has_application
    condition: $application_id != "" && $application_id != null
    then:
      - action: system/Common/HTTP/HTTP Request
        name: SetApplicationCriticality
        inputs:
          - name: method
            value: '"PATCH"'
          - name: host
            value: $concert_core_url + "/concert/core/api/v1/applications/" + $application_id + "?release_version=1.0.0"
          - name: headers
            value: |-
              {
                  "Content-Type": "application/json",
                  "InstanceId": "0000-0000-0000-0000",
                  "Authorization": $auth_header
              }
          - name: body
            value: |-
              {
                  "criticality": $criticality,
                  "data_impact_risk": $criticality
              }
    else:
      - action: system/Common/Status Message Update
        name: report_application_missing
        inputs:
          - name: message
            value: '"Application " + $application_name + " not found after discovery - criticality not set"'
  - action: assign
    name: Assign_result
    variable: $result
    value: |-
      {
          "connection_id": $connection_id,
          "discovery_job_id": $discovery_job_id,
          "application_name": $application_name,
          "application_id": $application_id
      }
variables:
  - name: result
    required: false
    isInput: false
    isOutput: true
    level: INTERMEDIATE
    type:
      type: object
    value: "{}"
  # No hardcoded cluster URL default on purpose - the caller passes the value
  # from HCP Vault (kept current by optimized-solution's post_config.yml).
  - name: concert_core_url
    required: true
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
  - name: concert_api_key
    required: true
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
  - name: deployment_id
    required: true
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
  - name: environment_type
    required: true
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '"DEV"'
  - name: app_name
    required: true
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
  - name: app_namespace
    required: true
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
  - name: k3s_endpoint
    required: true
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
  - name: k3s_token
    required: true
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
  - name: cluster_name
    required: true
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
  - name: purpose
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
  - name: criticality
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: number
    value: "2"
  - name: application_name
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
  - name: application_id
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
  - name: connection_id
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
  - name: discovery_job_id
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
  - name: discovery_job_name
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
  - name: auth_header
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
  - name: environment_description
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
  - name: resilience_profile
    required: false
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '"auto_discovery_k8s_profile"'
  - name: app_wait_seconds
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: number
    value: "300"
  - name: app_wait_start
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: any
    value: '""'
meta:
  version: 5
  description: >-
    Register a RIA-provisioned k3s cluster in Concert like the UI's discovery
    wizard: kubernetes credential, environment (name = deployment_id,
    purpose from environment_type), native discovery of the app namespace
    with Trivy image scanning into the shared application "<app>-<env>",
    then that application's criticality/data impact risk from
    environment_type (PROD 5, STAGE 4, INT 3, DEV 2) so Concert's risk score
    ranks PROD CVEs higher.
    server_validation_enabled is false (self-signed k3s API cert).
  layout: flow
  workerGroup: default
finally: null
