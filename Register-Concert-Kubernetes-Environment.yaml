name: Register-Concert-Kubernetes-Environment
platform: node
blocks:
  # "Cannot index string with string 'id'" (the HTTP Request's response
  # coming back as a raw JSON string instead of a parsed object) happened
  # FOUR times in a row, for four different reasons, all live-confirmed by
  # reproducing the exact request/flow logic:
  #   1. Assumed (wrongly) it was "+" concatenation inside a headers/body
  #      block. Harmless to keep (matches this repo's own convention: only
  #      bare $var substitution is used inside headers/body elsewhere), but
  #      not the actual bug.
  #   2. CreateConnection's body sent cluster_name/namespaces under a made-up
  #      "other_fields" key Concert Core's decoder rejects (with a bare JSON
  #      string, not an object, as the error body - which is what broke jq
  #      downstream each time). cluster_name belongs on the ingestion job's
  #      details.parameters instead, matching the working OCP connection in
  #      concert_environment.yml.
  #   3. CreateEnvironment's "tags" was a plain string array; Concert Core
  #      wants a different type (openapi.EntityTags, shape unverified) -
  #      matched the working OCP environment, which just sends tags: [].
  #   4. THE STRUCTURAL BUG (this pass): the jq action that extracts an id
  #      was named the same as the flow variable meant to hold that id
  #      (e.g. action "connection_id" vs variable $connection_id). Every
  #      later reference to the bare $connection_id/$environment_id then
  #      resolved to the ACTION's own output object ({result: "<uuid>"}),
  #      not the plain id string - so e.g. CreateIngestionJob's
  #      "credentials_id": $connection_id sent the whole object where a
  #      string was expected, hitting the identical decoder-rejects-with-a-
  #      bare-string failure one step further down the chain each time
  #      (connection_id -> environment_id -> ingestion_job_id, in that
  #      order, matching the three error reports received in order).
  #      Fixed by renaming every extraction node to extract_* and always
  #      explicitly assign-ing the plain-string flow variable from
  #      $extract_*.result, in both the "just created" and "already
  #      existed" paths, so the bare $connection_id/$environment_id/
  #      $ingestion_job_id used everywhere below is unambiguous.
  - action: assign
    name: build_auth_header
    variable: $auth_header
    value: '"C_API_KEY " + $concert_api_key'
  - action: assign
    name: build_connection_description
    variable: $connection_description
    value: '"Registered by Concert Workflows (" + $instance_name + ")"'
  - action: assign
    name: build_environment_description
    variable: $environment_description
    value: '"RIA demo environment (" + $instance_name + " / " + $app_name + ")"'
  - action: assign
    name: build_ingestion_job_name
    variable: $ingestion_job_name
    value: '$connection_name + " data collection"'
  - action: system/Common/HTTP/HTTP Request
    name: CreateConnection
    inputs:
      - name: method
        value: '"POST"'
      - name: host
        value: $concert_core_url + "/concert/core/api/v1/credentials"
      - name: headers
        value: |-
          {
              "Content-Type": "application/json",
              "InstanceId": "0000-0000-0000-0000",
              "Authorization": $auth_header
          }
      - name: body
        value: |-
          {
              "name": $connection_name,
              "description": $connection_description,
              "type": "kubernetes",
              "credentials": [
                  { "key": "endpoint", "value": $k3s_endpoint },
                  { "key": "server_validation_enabled", "value": "false" },
                  { "key": "token", "value": $k3s_token }
              ]
          }
  - action: system/Common/JSON/jq
    name: extract_connection_id
    inputs:
      - name: JSON
        value: $CreateConnection.result
      - name: Filter
        value: '".id // empty"'
  - action: assign
    name: set_connection_id_from_create
    variable: $connection_id
    value: $extract_connection_id.result
  - action: if
    name: connection_already_existed
    condition: $connection_id == "" || $connection_id == null
    then:
      - action: system/Common/HTTP/HTTP Request
        name: ListConnections
        inputs:
          - name: method
            value: '"GET"'
          - name: host
            value: $concert_core_url + "/concert/core/api/v1/credentials"
          - name: headers
            value: |-
              {
                  "InstanceId": "0000-0000-0000-0000",
                  "Authorization": $auth_header
              }
      - action: system/Common/JSON/jq
        name: extract_existing_connection_id
        inputs:
          - name: JSON
            value: $ListConnections.result
          - name: Filter
            value: '".credentials[] | select(.name==\"" + $connection_name + "\") | .id"'
      - action: assign
        name: set_connection_id_from_lookup
        variable: $connection_id
        value: $extract_existing_connection_id.result
    else: []
  - action: system/Common/HTTP/HTTP Request
    name: CreateEnvironment
    inputs:
      - name: method
        value: '"POST"'
      - name: host
        value: $concert_core_url + "/concert/core/api/v1/environments"
      - name: headers
        value: |-
          {
              "Content-Type": "application/json",
              "InstanceId": "0000-0000-0000-0000",
              "Authorization": $auth_header
          }
      - name: body
        value: |-
          {
              "name": $environment_name,
              "description": $environment_description,
              "tags": [],
              "type": "kubernetes",
              "purpose": "Demo"
          }
  - action: system/Common/JSON/jq
    name: extract_environment_id
    inputs:
      - name: JSON
        value: $CreateEnvironment.result
      - name: Filter
        value: '".id // empty"'
  - action: assign
    name: set_environment_id_from_create
    variable: $environment_id
    value: $extract_environment_id.result
  - action: if
    name: environment_already_existed
    condition: $environment_id == "" || $environment_id == null
    then:
      - action: system/Common/HTTP/HTTP Request
        name: ListEnvironments
        inputs:
          - name: method
            value: '"GET"'
          - name: host
            value: $concert_core_url + "/concert/core/api/v1/environments"
          - name: headers
            value: |-
              {
                  "InstanceId": "0000-0000-0000-0000",
                  "Authorization": $auth_header
              }
      - action: system/Common/JSON/jq
        name: extract_existing_environment_id
        inputs:
          - name: JSON
            value: $ListEnvironments.result
          - name: Filter
            value: '".environments[] | select(.name==\"" + $environment_name + "\") | .id"'
      - action: assign
        name: set_environment_id_from_lookup
        variable: $environment_id
        value: $extract_existing_environment_id.result
    else: []
  - action: system/Common/HTTP/HTTP Request
    name: CreateIngestionJob
    inputs:
      - name: method
        value: '"POST"'
      - name: host
        value: $concert_core_url + "/concert/core/api/v1/ingestion_jobs"
      - name: headers
        value: |-
          {
              "Content-Type": "application/json",
              "InstanceId": "0000-0000-0000-0000",
              "Authorization": $auth_header
          }
      - name: body
        value: |-
          {
              "name": $ingestion_job_name,
              "description": "Kubernetes environment discovery (managed by Concert Workflows)",
              "type": "kubernetes",
              "credentials_id": $connection_id,
              "scheduled": 0,
              "enabled": "enabled",
              "details": {
                  "parameters": [
                      { "key": "environment_id", "value": $environment_id },
                      { "key": "cluster_name", "value": $cluster_name },
                      { "key": "app_name", "value": $app_name },
                      { "key": "app_version", "value": $app_version }
                  ]
              }
          }
  - action: system/Common/JSON/jq
    name: extract_ingestion_job_id
    inputs:
      - name: JSON
        value: $CreateIngestionJob.result
      - name: Filter
        value: '".id // empty"'
  - action: assign
    name: set_ingestion_job_id
    variable: $ingestion_job_id
    value: $extract_ingestion_job_id.result
  - action: if
    name: has_new_ingestion_job
    condition: $ingestion_job_id != "" && $ingestion_job_id != null
    then:
      - action: system/Common/HTTP/HTTP Request
        name: TriggerCollection
        inputs:
          - name: method
            value: '"POST"'
          - name: host
            value: $concert_core_url + "/concert/ingestion/api/v1/collect_data"
          - name: headers
            value: |-
              {
                  "Content-Type": "application/json",
                  "InstanceId": "0000-0000-0000-0000",
                  "Authorization": $auth_header
              }
          - name: body
            value: |-
              {
                  "job_id": $ingestion_job_id
              }
    else: []
  - action: assign
    name: Assign_result
    variable: $result
    value: |-
      {
          "connection_id": $connection_id,
          "environment_id": $environment_id,
          "ingestion_job_id": $ingestion_job_id
      }
variables:
  - name: result
    required: false
    isInput: false
    isOutput: true
    level: INTERMEDIATE
    type:
      type: object
    value: "{}"
  # No hardcoded cluster URL as a default on purpose - this flow is only ever
  # meant to run with concert_core_url supplied by the caller (End-to-End-
  # Automation.yaml fetches it from HCP Vault via HCP_Vault_Dedicated_Get_Secret,
  # kept current there by optimized-solution's post_config.yml on every
  # install/reinstall - see that task's Vault sync). A stale hardcoded
  # cluster URL here would silently point at the wrong cluster the moment a
  # new one is provisioned, especially if this flow is ever run standalone
  # from Concert Workflows Studio without overriding it. Empty default
  # matches concert_api_key just below, which never had this problem.
  - name: concert_core_url
    required: true
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
  - name: concert_api_key
    required: true
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
  - name: instance_name
    required: true
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
  - name: app_name
    required: false
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
  # Live-confirmed 2026-09-30: without app_name/app_version in the ingestion
  # job's details.parameters, the "kubernetes" connector's SBOM generation
  # step logs "kubernetes application name: " (empty) and fails with
  # "deployment name cannot be empty", leaving the job status ERROR - the
  # scan itself still ran (fetched real data, e.g. 24 Deployments in one
  # test), it just never got persisted. Adding both turned the same run
  # SUCCESS. The already-working OCP connector (concert_environment.yml)
  # doesn't need this - a difference in the two connectors' backend code,
  # not something this repo controls. app_version has no natural source
  # here (ria-ansible doesn't track one); static placeholder.
  - name: app_version
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '"1.0.0"'
  - name: cloud_provider
    required: false
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
  - name: k3s_endpoint
    required: true
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
  - name: k3s_token
    required: true
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
  - name: cluster_name
    required: false
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
  - name: namespaces
    required: false
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
  # connection_name/environment_name have no expression default on purpose -
  # a default of $instance_name + " (Kubernetes)" broke with "$instance_name
  # is not defined" the first time this actually ran (live-confirmed).
  # Variable defaults are evaluated before input bindings, so they can't
  # reference another variable - every other flow in this repo only uses
  # static-literal defaults, which is the pattern to follow. The caller
  # computes and passes both explicitly (see End-to-End-Automation.yaml).
  - name: connection_name
    required: true
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
  - name: environment_name
    required: true
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
  # These three hold plain id strings, explicitly assign-ed from the
  # extract_*.result of their matching jq node (never read bare off a
  # same-named action - see the CORRECTION at the top of this file for why).
  - name: connection_id
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
  - name: environment_id
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
  - name: ingestion_job_id
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
  - name: auth_header
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
  - name: connection_description
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
  - name: environment_description
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
  - name: ingestion_job_name
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
meta:
  version: 5
  description: >-
    Register a RIA-provisioned k3s cluster as a Kubernetes environment in
    Concert (connection + environment + ingestion job + trigger collection),
    reusing the connector type/field shape confirmed live for Concert
    3.0.1.1's OCP environment registration (roles/concert_platform/tasks/
    concert_environment.yml in the optimized-solution repo). Four real bugs
    were found and fixed only by actually running this end to end (see the
    CORRECTION note at the top of the blocks list) - re-test after any
    further edit before relying on it for a demo.
    server_validation_enabled is hardcoded to false (self-signed k3s API
    server cert on the ephemeral VM), matching validate_certs:false used
    elsewhere in this project for the same class of target.
  layout: flow
  workerGroup: default
finally: null
