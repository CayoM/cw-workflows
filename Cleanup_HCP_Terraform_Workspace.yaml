name: Cleanup_HCP_Terraform_Workspace
platform: node
blocks:
  - action: foreach
    name: Get_secrets
    list: $SECRETS
    blocks:
      - action: ./HCP_Vault_Dedicated_Get_Secret
        name: get_secret
        inputs:
          - name: secret_name
            value: $Get_secrets.item
          - name: HCP_AUTH_SECRET
            value: $HCP_VAULT_AUTH_SECRET
      - action: system/Common/Array/Array Push
        name: ArrayPush_1
        inputs:
          - name: array
            value: $retrieved_secrets
          - name: item
            value: |-
              {
                  "Name": $Get_secrets.item,
                  "Content": $get_secret.result
              }
  - action: system/Common/Status Message Update
    name: StatusMessageUpdate_1
    inputs:
      - name: message
        value: "\"Retrieved Secrets successfully: \"+$retrieved_secrets"
  - action: system/Common/JSON/jq
    name: filter_terraform_api_key
    inputs:
      - name: JSON
        value: $retrieved_secrets
      - name: Filter
        value: "\".[] | select(.Name == \\\"\" + $HCP_TERRAFORM_ENTERPRISE_TOKEN_IDENTIFIER\
          \ + \"\\\") | .Content\""
  - action: comment
    value: Override authentication in order to use the token fetched from HCP Vault
  - name: AuthOverride_1
    action: authOverride
    authentication: '"ibmconcert/terraform"'
    override: "{\"apiKey\":$filter_terraform_api_key.result}"
    breakpoint: enabled
  - action: system/HashiCorp/Terraform/Workspaces/List Workspaces
    name: HashiCorp_3
    inputs:
      - name: authKey
        value: $AuthOverride_1.result
      - name: organization_name
        value: $HCP_TERRAFORM_ORG_NAME
  - action: foreach
    name: ForEach_1
    list: $HashiCorp_3.result.data
    blocks:
      - action: if
        name: If_1
        breakpoint: enabled
        condition: "($ForEach_1.item.attributes[\"auto-destroy-status\"] == \"applied\"\
          ) && ($ForEach_1.item.attributes.actions[\"is-destroyable\"] == true)"
        then:
          - action: system/HashiCorp/Terraform/Workspaces/Force Delete a Workspace by Name
            name: HashiCorp_4
            inputs:
              - name: authKey
                value: $AuthOverride_1.result
              - name: organization_name
                value: $HCP_TERRAFORM_ORG_NAME
              - name: name
                value: $ForEach_1.item.attributes.name
            breakpoint: enabled
          - action: assign
            name: Assign_1
            variable: $result
            value: $HashiCorp_4.result
            breakpoint: enabled
        else: []
  # Concert reconcile: every Concert environment created by the demo is of
  # type kubernetes and carries the description prefix "RIA demo environment" and is named after its
  # deployment id = HCP workspace name. If HCP answers 404 for that workspace
  # the VM is gone -> delete the environment and its credential. Anything but
  # an explicit 404 (auth error, outage) keeps the environment. The workspace
  # is looked up by name instead of diffing against List Workspaces, which is
  # paginated - a missing page would otherwise delete live environments.
  # Applications are never deleted (shared "<app>-<env>" objects).
  - action: ./HCP_Vault_Dedicated_Get_Secret
    name: get_concert_core_url
    inputs:
      - name: secret_name
        value: '"concert_core_url"'
      - name: HCP_AUTH_SECRET
        value: $HCP_VAULT_AUTH_SECRET
  - action: ./HCP_Vault_Dedicated_Get_Secret
    name: get_concert_api_key
    inputs:
      - name: secret_name
        value: '"concert_api_key"'
      - name: HCP_AUTH_SECRET
        value: $HCP_VAULT_AUTH_SECRET
  - action: assign
    name: build_concert_auth_header
    variable: $concert_auth_header
    value: '"C_API_KEY " + $get_concert_api_key.result'
  - action: assign
    name: build_hcp_auth_header
    variable: $hcp_auth_header
    value: '"Bearer " + $filter_terraform_api_key.result'
  - action: system/Common/HTTP/HTTP Request
    name: ListConcertEnvironments
    inputs:
      - name: method
        value: '"GET"'
      - name: host
        value: $get_concert_core_url.result + "/concert/core/api/v1/environments?page_size=500"
      - name: headers
        value: |-
          {
              "InstanceId": "0000-0000-0000-0000",
              "Authorization": $concert_auth_header
          }
  - action: system/Common/JSON/jq
    name: extract_kubernetes_environments
    inputs:
      - name: JSON
        value: $ListConcertEnvironments.result
      - name: Filter
        value: '"[.environments[] | select(.type == \"kubernetes\") | {id, name}]"'
  - action: foreach
    name: Reconcile_Concert
    list: $extract_kubernetes_environments.result
    blocks:
      # The list endpoint omits "description" - only the detail call has the
      # marker, so only environments this demo created are ever touched.
      - action: system/Common/HTTP/HTTP Request
        name: GetConcertEnvironment
        inputs:
          - name: method
            value: '"GET"'
          - name: host
            value: $get_concert_core_url.result + "/concert/core/api/v1/environments/" + $Reconcile_Concert.item.id
          - name: headers
            value: |-
              {
                  "InstanceId": "0000-0000-0000-0000",
                  "Authorization": $concert_auth_header
              }
      - action: system/Common/JSON/jq
        name: extract_is_demo_environment
        inputs:
          - name: JSON
            value: $GetConcertEnvironment.result
          - name: Filter
            value: '"(.description // \"\") | startswith(\"RIA demo environment\") | tostring"'
      - action: system/Common/HTTP/HTTP Request
        name: GetWorkspace
        inputs:
          - name: method
            value: '"GET"'
          - name: host
            value: '"https://app.terraform.io/api/v2/organizations/" + $HCP_TERRAFORM_ORG_NAME + "/workspaces/" + encodeURIComponent($Reconcile_Concert.item.name)'
          - name: headers
            value: |-
              {
                  "Authorization": $hcp_auth_header,
                  "Content-Type": "application/vnd.api+json"
              }
      - action: system/Common/JSON/jq
        name: extract_workspace_status
        inputs:
          - name: JSON
            value: $GetWorkspace.result
          - name: Filter
            value: '"(.errors[0].status // \"found\") | tostring"'
      - action: if
        name: workspace_is_gone
        # HCP also answers 404 when the org/token cannot see a workspace, so
        # only trust a 404 if this run's own workspace listing succeeded.
        condition: $HashiCorp_3.result.data != null && $extract_is_demo_environment.result == "true" && $extract_workspace_status.result == "404"
        then:
          - action: system/Common/HTTP/HTTP Request
            name: ListConcertCredentials
            inputs:
              - name: method
                value: '"GET"'
              - name: host
                value: $get_concert_core_url.result + "/concert/core/api/v1/credentials"
              - name: headers
                value: |-
                  {
                      "InstanceId": "0000-0000-0000-0000",
                      "Authorization": $concert_auth_header
                  }
          - action: system/Common/JSON/jq
            name: extract_credential_ids
            inputs:
              - name: JSON
                value: $ListConcertCredentials.result
              - name: Filter
                value: '"[.credentials[] | select(.name==\"" + $Reconcile_Concert.item.name + "\") | .id] | join(\",\")"'
          - action: system/Common/HTTP/HTTP Request
            name: DeleteConcertEnvironment
            inputs:
              - name: method
                value: '"DELETE"'
              - name: host
                value: $get_concert_core_url.result + "/concert/core/api/v1/environments/" + $Reconcile_Concert.item.id
              - name: headers
                value: |-
                  {
                      "InstanceId": "0000-0000-0000-0000",
                      "Authorization": $concert_auth_header
                  }
          # Discovery jobs are listed under /ingestion_jobs (type discovery_job)
          # and named "discovery-<deployment_id>" by the Register flow.
          - action: system/Common/HTTP/HTTP Request
            name: ListConcertIngestionJobs
            inputs:
              - name: method
                value: '"GET"'
              - name: host
                value: $get_concert_core_url.result + "/concert/core/api/v1/ingestion_jobs"
              - name: headers
                value: |-
                  {
                      "InstanceId": "0000-0000-0000-0000",
                      "Authorization": $concert_auth_header
                  }
          - action: system/Common/JSON/jq
            name: extract_discovery_job_ids
            inputs:
              - name: JSON
                value: $ListConcertIngestionJobs.result
              - name: Filter
                value: '"[.ingestion_jobs[] | select(.name==\"discovery-" + $Reconcile_Concert.item.name + "\") | .id]"'
          - action: foreach
            name: DeleteDiscoveryJobs
            list: $extract_discovery_job_ids.result
            blocks:
              - action: system/Common/HTTP/HTTP Request
                name: DeleteDiscoveryJob
                inputs:
                  - name: method
                    value: '"DELETE"'
                  - name: host
                    value: $get_concert_core_url.result + "/concert/core/api/v1/ingestion_jobs/" + $DeleteDiscoveryJobs.item
                  - name: headers
                    value: |-
                      {
                          "InstanceId": "0000-0000-0000-0000",
                          "Authorization": $concert_auth_header
                      }
          - action: if
            name: has_credentials
            condition: $extract_credential_ids.result != "" && $extract_credential_ids.result != null
            then:
              - action: system/Common/HTTP/HTTP Request
                name: DeleteConcertCredentials
                inputs:
                  - name: method
                    value: '"DELETE"'
                  - name: host
                    value: $get_concert_core_url.result + "/concert/core/api/v1/credentials?delete_ids=" + $extract_credential_ids.result
                  - name: headers
                    value: |-
                      {
                          "InstanceId": "0000-0000-0000-0000",
                          "Authorization": $concert_auth_header
                      }
            else: []
          - action: system/Common/Status Message Update
            name: report_removed_environment
            inputs:
              - name: message
                value: '"Removed Concert environment " + $Reconcile_Concert.item.name'
        else: []
variables:
  - name: result
    required: false
    isInput: false
    isOutput: true
    level: INTERMEDIATE
    type:
      type: object
    value: "{}"
  - name: HCP_TERRAFORM_ENTERPRISE_TOKEN_IDENTIFIER
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '"terraform_api_key"'
  - name: HCP_TERRAFORM_ORG_NAME
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '"cayo-org"'
  - name: SECRETS
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: array
    value: |-
      [
          "terraform_api_key"
      ]
  - name: retrieved_secrets
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: array
    value: "[]"
  - name: HCP_VAULT_AUTH_SECRET
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '"ibmconcert/vault"'
    meta:
      authType: Common/ConfigData
      subType: authentication
  - name: concert_auth_header
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
  - name: hcp_auth_header
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
meta:
  version: 5
  layout: flow
  workerGroup: default
  description: This workflow deletes auto-destroyed HCP Terraform workspaces (resources
    are destroyed after 1 hour without changes) and removes Concert environments (and
    their credentials) whose workspace no longer exists.
finally: null
