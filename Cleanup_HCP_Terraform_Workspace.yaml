name: Cleanup_HCP_Terraform_Workspace
platform: node
blocks:
  - action: foreach
    name: Get_secrets
    list: $SECRETS
    blocks:
      - action: ./HCP_Vault_Dedicated_Get_Secret
        name: get_secret
        inputs:
          - name: secret_name
            value: $Get_secrets.item
          - name: HCP_AUTH_SECRET
            value: $HCP_VAULT_AUTH_SECRET
      - action: system/Common/Array/Array Push
        name: ArrayPush_1
        inputs:
          - name: array
            value: $retrieved_secrets
          - name: item
            value: |-
              {
                  "Name": $Get_secrets.item,
                  "Content": $get_secret.result
              }
  - action: system/Common/Status Message Update
    name: StatusMessageUpdate_1
    inputs:
      - name: message
        value: "\"Retrieved Secrets successfully: \"+$retrieved_secrets"
  - action: system/Common/JSON/jq
    name: filter_terraform_api_key
    inputs:
      - name: JSON
        value: $retrieved_secrets
      - name: Filter
        value: "\".[] | select(.Name == \\\"\" + $HCP_TERRAFORM_ENTERPRISE_TOKEN_IDENTIFIER\
          \ + \"\\\") | .Content\""
  - action: comment
    value: Override authentication in order to use the token fetched from HCP Vault
  - name: AuthOverride_1
    action: authOverride
    authentication: '"ibmconcert/terraform"'
    override: "{\"apiKey\":$filter_terraform_api_key.result}"
    breakpoint: enabled
  # Single source for the org shared with Create_HCP_Terraform_Workspace: a
  # wrong org here makes every workspace lookup 404 and would delete all live
  # demo environments, so a missing secret aborts the run.
  - action: ./HCP_Vault_Dedicated_Get_Secret
    name: get_hcp_terraform_org
    inputs:
      - name: secret_name
        value: '"hcp_terraform_org"'
      - name: HCP_AUTH_SECRET
        value: $HCP_VAULT_AUTH_SECRET
  - action: if
    name: hcp_terraform_org_missing
    condition: '!$get_hcp_terraform_org.result'
    then:
      - action: throw
        error: '"Vault secret hcp_terraform_org is missing or empty"'
    else: []
  - action: assign
    name: set_hcp_terraform_org
    variable: $HCP_TERRAFORM_ORG_NAME
    value: $get_hcp_terraform_org.result
  - action: system/HashiCorp/Terraform/Workspaces/List Workspaces
    name: HashiCorp_3
    inputs:
      - name: authKey
        value: $AuthOverride_1.result
      - name: organization_name
        value: $HCP_TERRAFORM_ORG_NAME
  - action: foreach
    name: ForEach_1
    list: $HashiCorp_3.result.data
    blocks:
      - action: if
        name: If_1
        breakpoint: enabled
        condition: "($ForEach_1.item.attributes[\"auto-destroy-status\"] == \"applied\"\
          ) && ($ForEach_1.item.attributes.actions[\"is-destroyable\"] == true)"
        then:
          - action: system/HashiCorp/Terraform/Workspaces/Force Delete a Workspace by Name
            name: HashiCorp_4
            inputs:
              - name: authKey
                value: $AuthOverride_1.result
              - name: organization_name
                value: $HCP_TERRAFORM_ORG_NAME
              - name: name
                value: $ForEach_1.item.attributes.name
            breakpoint: enabled
          - action: assign
            name: Assign_1
            variable: $result
            value: $HashiCorp_4.result
            breakpoint: enabled
        else: []
  # Concert reconcile: every Concert environment created by the demo carries
  # the description prefix "Concert demo environment" and is named after its
  # deployment id = HCP workspace name. Concert 3.0.1.1 drops the "type"
  # sent on create (always ""), so the description marker is the only filter. If HCP answers 404 for that workspace
  # the VM is gone -> delete the environment and its credential. Anything but
  # an explicit 404 (auth error, outage) keeps the environment. The workspace
  # is looked up by name instead of diffing against List Workspaces, which is
  # paginated - a missing page would otherwise delete live environments.
  # Credentials (+ their discovery jobs) and orphaned "<app>-<env>"
  # applications are reconciled in their own loops below, so leftovers from a
  # partial earlier run are still picked up once the environment is gone.
  - action: ./HCP_Vault_Dedicated_Get_Secret
    name: get_concert_core_url
    inputs:
      - name: secret_name
        value: '"concert_core_url"'
      - name: HCP_AUTH_SECRET
        value: $HCP_VAULT_AUTH_SECRET
  - action: ./HCP_Vault_Dedicated_Get_Secret
    name: get_concert_api_key
    inputs:
      - name: secret_name
        value: '"concert_api_key"'
      - name: HCP_AUTH_SECRET
        value: $HCP_VAULT_AUTH_SECRET
  - action: assign
    name: build_concert_auth_header
    variable: $concert_auth_header
    value: '"C_API_KEY " + $get_concert_api_key.result'
  - action: assign
    name: build_hcp_auth_header
    variable: $hcp_auth_header
    value: '"Bearer " + $filter_terraform_api_key.result'
  - action: system/Common/HTTP/HTTP Request
    name: ListConcertEnvironments
    inputs:
      - name: method
        value: '"GET"'
      - name: host
        value: $get_concert_core_url.result + "/concert/core/api/v1/environments?page_size=500"
      - name: headers
        value: |-
          {
              "InstanceId": "0000-0000-0000-0000",
              "Authorization": $concert_auth_header
          }
  - action: system/Common/JSON/jq
    name: extract_environments
    inputs:
      - name: JSON
        value: $ListConcertEnvironments.result
      - name: Filter
        value: '"[.environments[] | {id, name}]"'
  - action: foreach
    name: Reconcile_Concert
    list: $extract_environments.result
    blocks:
      # The list endpoint omits "description" - only the detail call has the
      # marker, so only environments this demo created are ever touched.
      - action: system/Common/HTTP/HTTP Request
        name: GetConcertEnvironment
        inputs:
          - name: method
            value: '"GET"'
          - name: host
            value: $get_concert_core_url.result + "/concert/core/api/v1/environments/" + $Reconcile_Concert.item.id
          - name: headers
            value: |-
              {
                  "InstanceId": "0000-0000-0000-0000",
                  "Authorization": $concert_auth_header
              }
      - action: system/Common/JSON/jq
        name: extract_is_demo_environment
        inputs:
          - name: JSON
            value: $GetConcertEnvironment.result
          - name: Filter
            value: '"(.description // \"\") | startswith(\"Concert demo environment\") | tostring"'
      - action: system/Common/HTTP/HTTP Request
        name: GetWorkspace
        inputs:
          - name: method
            value: '"GET"'
          - name: host
            value: '"https://app.terraform.io/api/v2/organizations/" + $HCP_TERRAFORM_ORG_NAME + "/workspaces/" + encodeURIComponent($Reconcile_Concert.item.name)'
          - name: headers
            value: |-
              {
                  "Authorization": $hcp_auth_header,
                  "Content-Type": "application/vnd.api+json"
              }
      - action: system/Common/JSON/jq
        name: extract_workspace_status
        inputs:
          - name: JSON
            value: $GetWorkspace.result
          - name: Filter
            value: '"(.errors[0].status // \"found\") | tostring"'
      - action: if
        name: workspace_is_gone
        # HCP also answers 404 when the org/token cannot see a workspace, so
        # only trust a 404 if this run's own workspace listing succeeded.
        condition: $HashiCorp_3.result.data != null && $extract_is_demo_environment.result == "true" && $extract_workspace_status.result == "404"
        then:
          - action: system/Common/HTTP/HTTP Request
            name: DeleteConcertEnvironment
            inputs:
              - name: method
                value: '"DELETE"'
              - name: host
                value: $get_concert_core_url.result + "/concert/core/api/v1/environments/" + $Reconcile_Concert.item.id
              - name: headers
                value: |-
                  {
                      "InstanceId": "0000-0000-0000-0000",
                      "Authorization": $concert_auth_header
                  }
          - action: system/Common/Status Message Update
            name: report_removed_environment
            inputs:
              - name: message
                value: '"Removed Concert environment " + $Reconcile_Concert.item.name'
        else: []
  # Credential reconcile, independent of the environment loop: a credential
  # whose environment was already deleted (earlier partial run, manual delete)
  # would otherwise never be visited again. Register names the credential after
  # the deployment id and gives it the same "Concert demo environment"
  # description marker. Its discovery jobs are matched by credentials_id, not
  # by name - re-runs like "discovery-<id>-r2" were missed by an exact name
  # match and kept the credential alive.
  - action: system/Common/HTTP/HTTP Request
    name: ListConcertCredentials
    inputs:
      - name: method
        value: '"GET"'
      - name: host
        value: $get_concert_core_url.result + "/concert/core/api/v1/credentials?page_size=500"
      - name: headers
        value: |-
          {
              "InstanceId": "0000-0000-0000-0000",
              "Authorization": $concert_auth_header
          }
  - action: system/Common/JSON/jq
    name: extract_demo_credentials
    inputs:
      - name: JSON
        value: $ListConcertCredentials.result
      - name: Filter
        value: '"[.credentials[] | select((.description // \"\") | startswith(\"Concert demo environment\")) | {id, name}]"'
  - action: foreach
    name: Reconcile_Credentials
    list: $extract_demo_credentials.result
    blocks:
      - action: system/Common/HTTP/HTTP Request
        name: GetCredentialWorkspace
        inputs:
          - name: method
            value: '"GET"'
          - name: host
            value: '"https://app.terraform.io/api/v2/organizations/" + $HCP_TERRAFORM_ORG_NAME + "/workspaces/" + encodeURIComponent($Reconcile_Credentials.item.name)'
          - name: headers
            value: |-
              {
                  "Authorization": $hcp_auth_header,
                  "Content-Type": "application/vnd.api+json"
              }
      - action: system/Common/JSON/jq
        name: extract_credential_workspace_status
        inputs:
          - name: JSON
            value: $GetCredentialWorkspace.result
          - name: Filter
            value: '"(.errors[0].status // \"found\") | tostring"'
      - action: if
        name: credential_workspace_is_gone
        # Same 404 guard as the environment loop.
        condition: $HashiCorp_3.result.data != null && $extract_credential_workspace_status.result == "404"
        then:
          - action: system/Common/HTTP/HTTP Request
            name: ListConcertIngestionJobs
            inputs:
              - name: method
                value: '"GET"'
              - name: host
                value: $get_concert_core_url.result + "/concert/core/api/v1/ingestion_jobs"
              - name: headers
                value: |-
                  {
                      "InstanceId": "0000-0000-0000-0000",
                      "Authorization": $concert_auth_header
                  }
          - action: system/Common/JSON/jq
            name: extract_discovery_job_ids
            inputs:
              - name: JSON
                value: $ListConcertIngestionJobs.result
              - name: Filter
                value: '"[.ingestion_jobs[] | select(.credentials_id==\"" + $Reconcile_Credentials.item.id + "\") | .id]"'
          - action: foreach
            name: DeleteDiscoveryJobs
            list: $extract_discovery_job_ids.result
            blocks:
              - action: system/Common/HTTP/HTTP Request
                name: DeleteDiscoveryJob
                inputs:
                  - name: method
                    value: '"DELETE"'
                  - name: host
                    value: $get_concert_core_url.result + "/concert/core/api/v1/ingestion_jobs/" + $DeleteDiscoveryJobs.item
                  - name: headers
                    value: |-
                      {
                          "InstanceId": "0000-0000-0000-0000",
                          "Authorization": $concert_auth_header
                      }
          - action: system/Common/HTTP/HTTP Request
            name: DeleteConcertCredential
            inputs:
              - name: method
                value: '"DELETE"'
              - name: host
                value: $get_concert_core_url.result + "/concert/core/api/v1/credentials?delete_ids=" + $Reconcile_Credentials.item.id
              - name: headers
                value: |-
                  {
                      "InstanceId": "0000-0000-0000-0000",
                      "Authorization": $concert_auth_header
                  }
          - action: system/Common/Status Message Update
            name: report_removed_credential
            inputs:
              - name: message
                value: '"Removed Concert credential " + $Reconcile_Credentials.item.name'
        else: []
  # Application reconcile: discovery creates one "<app>-<env>" application per
  # environment type (shared by all deployments of that type). Once its last
  # environment is gone the application only carries stale findings, so it is
  # deleted. Three guards keep non-demo applications safe (sample apps and
  # other ingested apps also have no environments): the name ends in one of
  # Register's environment types, criticality > 0 (only Register sets it), and
  # the detail call lists no environment. A failed detail call has neither
  # field, so it never deletes.
  - action: system/Common/HTTP/HTTP Request
    name: ListConcertApplications
    inputs:
      - name: method
        value: '"GET"'
      - name: host
        value: $get_concert_core_url.result + "/concert/core/api/v2/applications?page_size=500"
      - name: headers
        value: |-
          {
              "InstanceId": "0000-0000-0000-0000",
              "Authorization": $concert_auth_header
          }
  - action: system/Common/JSON/jq
    name: extract_demo_applications
    inputs:
      - name: JSON
        value: $ListConcertApplications.result
      - name: Filter
        value: '"[.applications[] | select(.sample != true and (.name | endswith(\"-prod\") or endswith(\"-stage\") or endswith(\"-int\") or endswith(\"-dev\"))) | {id, name, version}]"'
  - action: foreach
    name: Reconcile_Applications
    list: $extract_demo_applications.result
    blocks:
      - action: system/Common/HTTP/HTTP Request
        name: GetConcertApplication
        inputs:
          - name: method
            value: '"GET"'
          - name: host
            value: $get_concert_core_url.result + "/concert/core/api/v1/applications/" + $Reconcile_Applications.item.id + "?release_version=" + encodeURIComponent($Reconcile_Applications.item.version)
          - name: headers
            value: |-
              {
                  "InstanceId": "0000-0000-0000-0000",
                  "Authorization": $concert_auth_header
              }
      - action: system/Common/JSON/jq
        name: extract_is_orphaned_application
        inputs:
          - name: JSON
            value: $GetConcertApplication.result
          - name: Filter
            value: '"(.associations != null and ((.associations.environments // []) | length) == 0 and (.criticality // 0) > 0) | tostring"'
      - action: if
        name: application_is_orphaned
        condition: $extract_is_orphaned_application.result == "true"
        then:
          - action: system/Common/HTTP/HTTP Request
            name: DeleteConcertApplication
            inputs:
              - name: method
                value: '"DELETE"'
              - name: host
                value: $get_concert_core_url.result + "/concert/core/api/v2/applications/" + $Reconcile_Applications.item.id
              - name: headers
                value: |-
                  {
                      "InstanceId": "0000-0000-0000-0000",
                      "Authorization": $concert_auth_header
                  }
          - action: system/Common/Status Message Update
            name: report_removed_application
            inputs:
              - name: message
                value: '"Removed orphaned Concert application " + $Reconcile_Applications.item.name'
        else: []
variables:
  - name: result
    required: false
    isInput: false
    isOutput: true
    level: INTERMEDIATE
    type:
      type: object
    value: "{}"
  - name: HCP_TERRAFORM_ENTERPRISE_TOKEN_IDENTIFIER
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '"terraform_api_key"'
  - name: HCP_TERRAFORM_ORG_NAME
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
  - name: SECRETS
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: array
    value: |-
      [
          "terraform_api_key"
      ]
  - name: retrieved_secrets
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: array
    value: "[]"
  - name: HCP_VAULT_AUTH_SECRET
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '"ibmconcert/vault"'
    meta:
      authType: Common/ConfigData
      subType: authentication
  - name: concert_auth_header
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
  - name: hcp_auth_header
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
meta:
  version: 5
  layout: flow
  workerGroup: default
  description: This workflow deletes auto-destroyed HCP Terraform workspaces (resources
    are destroyed after 1 hour without changes), removes Concert environments,
    credentials and discovery jobs whose workspace no longer exists, and deletes
    "<app>-<env>" applications left without any environment.
finally: null
