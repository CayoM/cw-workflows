name: Prepare-AWX
platform: node
blocks:
  - action: ./HCP_Vault_Dedicated_Get_Secret
    name: get_aap_password
    inputs:
      - name: secret_name
        value: $aap_password_secret_name
      - name: HCP_AUTH_SECRET
        value: $vault_auth
  - action: ./HCP_Vault_Dedicated_Get_Secret
    name: get_aap_url
    inputs:
      - name: secret_name
        value: $aap_url_secret_name
      - name: HCP_AUTH_SECRET
        value: $vault_auth
  - name: AuthOverride_1
    action: authOverride
    authentication: '"ibmconcert/awx"'
    override: "{\"host\":$get_aap_url.result,\"username\":\"admin\",\"password\":$get_aap_password.result}"
  - action: system/Ansible/Tower/Projects/Projects Create
    name: Create_Project
    inputs:
      - name: authKey
        value: $AuthOverride_1.result
      - name: data
        value: |-
          {
              "allow_override": true,
              "name": "Concert Automation",
              "organization": 1,
              "scm_type": "git",
              "scm_url": $GIT_URL
          }
  - action: system/Ansible/Tower/Job Templates/Job Templates Create
    name: Create_Template
    inputs:
      - name: authKey
        value: $AuthOverride_1.result
      - name: data
        value: |-
          {
              "ask_variables_on_launch": true,
              "name": $template_name,
              "organization": 1,
              "playbook": $playbook_name,
              "project": $Create_Project.result.id,
              "inventory": 1
          }
  - action: system/Ansible/Tower/Job Templates/Job Templates Credentials Create
    name: Add_Default_credential_to_Template
    inputs:
      - name: authKey
        value: $AuthOverride_1.result
      - name: id
        value: $Create_Template.result.id
      - name: data
        value: "{\"id\": 1}"
variables:
  - name: vault_auth
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '"ibmconcert/vault"'
    meta:
      authType: ANY
      subType: authentication
  - name: aap_url_secret_name
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '"awx_url"'
  - name: aap_password_secret_name
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '"awx_admin_password"'
  - name: GIT_URL
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '"https://github.com/CayoM/ria-ansible"'
  - name: template_name
    required: false
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '"setup-ec2-instance-automated"'
  - name: playbook_name
    required: false
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '"playbook-concert.yaml"'
meta:
  version: 5
  description: Prepare an AWX Instance (create Templates and Projects) for End-To-End
    Automation
  layout: flow
  workerGroup: default
finally: null
