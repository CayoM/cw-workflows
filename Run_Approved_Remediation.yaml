name: Run_Approved_Remediation
platform: node
blocks:
  # Demo timing for Concert OS auto-remediation. IBM's Monitor_Remediation_Action_Status
  # marks an action "scheduled" once its ServiceNow incident is "In Progress", then plans
  # Remediation_Master for the maintenance window, or +24 h without one. A demo lasts
  # 15 minutes, so this flow (scheduled every minute) starts IBM's Remediation_Master
  # right away for each scheduled OS action, with the same filter IBM's own job uses,
  # and afterwards re-scans that VM so Concert closes the fixed CVEs live.
  # Remediation_Master only takes actions in approved/scheduled and sets them to
  # in_progress first, so an overlapping run finds nothing. It sets a failed run back to
  # approved; searching approved too (IBM's own Remediation_Master filter) retries it in
  # the next minute instead of waiting for Monitor's +24 h job, up to max_attempts patch
  # runs (counted in the action history). Then it gives the action up: status failed
  # (like IBM's flows mark a failed PR) and its ServiceNow incident canceled. A left-over
  # approved action would make Monitor fail every run on its existing +24 h job (409
  # Duplicate entry), and with it every newer action. Background:
  # optimized-solution docs/WORKAROUNDS.md.
  - action: system/IBM/Concert v2/Action Insights/Search in Actions
    name: GetScheduledActions
    inputs:
      - name: Body
        value: |-
          {
              "filters": {
                  "logic": "and",
                  "conditions": [{
                      "field": "status",
                      "value": "approved,scheduled",
                      "operator": "IN"
                  }, {
                      "field": "action_category",
                      "value": "auto_remediation",
                      "operator": "="
                  }, {
                      "field": "target_component_type",
                      "value": "os",
                      "operator": "="
                  }]
              },
              "pagination": {
                  "page": 1,
                  "page_size": 50
              }
          }
  - name: Split_By_Attempts
    function: |-
      const found = Array.isArray($GetScheduledActions?.result?.actions) ? $GetScheduledActions.result.actions : [];
      const attempts = a => {
        let history = [];
        try { history = Array.isArray(a.history) ? a.history : JSON.parse(a.history || "[]"); } catch (e) { history = []; }
        return history.filter(h => h.event === "update status to in_progress").length;
      };
      $scheduled_actions = found.filter(a => attempts(a) < $max_attempts);
      $abandoned_actions = found.filter(a => attempts(a) >= $max_attempts);
  - action: if
    name: Nothing_To_Do
    condition: $scheduled_actions.length == 0 && $abandoned_actions.length == 0
    then:
      - action: exit
    else: []
  - action: foreach
    name: Abandon_Action
    list: $abandoned_actions
    blocks:
      - action: try
        name: Abandon_One
        try:
          - action: system/IBM/Concert v2/Action Insights/Update Existing Action
            name: Mark_Action_Failed
            inputs:
              - name: Body
                value: |-
                  {
                      "actions": [{
                          "action_id": $Abandon_Action.item.actions_identifier,
                          "status": "failed",
                          "history": JSON.stringify({
                              "event": "Remediation given up",
                              "user": "ibmconcert",
                              "timestamp": Math.floor(Date.now() / 1000),
                              "comments": "Patch failed " + $max_attempts + " times (Run_Approved_Remediation), e.g. the VM is gone."
                          })
                      }]
                  }
          - action: assign
            name: Assign_Incident
            variable: $incident_sys_id
            value: '((JSON.parse($Abandon_Action.item.action_details || "{}").change_request || {}).identifier || "")'
          - action: if
            name: Has_Incident
            condition: $incident_sys_id != ""
            then:
              - action: system/ServiceNow/updateTable
                name: Cancel_Incident
                inputs:
                  - name: authKey
                    value: $sm_auth
                  - name: tableName
                    value: "'incident'"
                  - name: sys_id
                    value: $incident_sys_id
                  - name: Table
                    value: '{"state": "8", "close_notes": "Concert gave up the remediation after " + $max_attempts + " failed patch runs."}'
            else: []
          - action: system/Common/Status Message Update
            name: Report_Abandoned
            inputs:
              - name: message
                value: '"Gave up action " + $Abandon_Action.item.actions_identifier + " on " + $Abandon_Action.item.target_component_identifier'
        catch:
          - action: system/Common/Status Message Update
            name: Abandon_Failed_Message
            inputs:
              - name: message
                value: '"Could not give up action " + $Abandon_Action.item.actions_identifier'
  - action: foreach
    name: Remediate_Action
    list: $scheduled_actions
    blocks:
      - action: try
        name: Remediate_One
        try:
          - action: assign
            name: Assign_Environment
            variable: $environment_name
            value: '(JSON.parse($Remediate_Action.item.action_details || "{}").environment || "")'
          - action: system/Common/Status Message Update
            name: Report_Start
            inputs:
              - name: message
                value: '"Patching action " + $Remediate_Action.item.actions_identifier + " on " + $Remediate_Action.item.target_component_identifier + " (" + $environment_name + ")"'
          - action: ./Remediation_Master/Remediation_Master
            name: Run_Remediation_Master
            inputs:
              - name: filter
                value: '{"field": "actions_identifier", "operator": "=", "value": String($Remediate_Action.item.actions_identifier)}'
              - name: linux_auth
                value: $linux_auth
              - name: sm_auth
                value: $sm_auth
          - action: if
            name: Has_Environment
            condition: $environment_name != ""
            then:
              - action: ./Refresh-Scans
                name: Rescan_Host
                inputs:
                  - name: deployment_id
                    value: $environment_name
                  - name: host_scan_only
                    value: "true"
            else: []
        catch:
          - action: system/Common/Status Message Update
            name: Remediation_Failed_Message
            inputs:
              - name: message
                value: '"Remediation failed for action " + $Remediate_Action.item.actions_identifier'
variables:
  - name: max_attempts
    required: false
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: number
    value: "5"
  - name: linux_auth
    required: false
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '"ibmconcert/remediation-linux-configs"'
  - name: sm_auth
    required: false
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '"ibmconcert/snow"'
  - name: scheduled_actions
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: array
    value: "[]"
  - name: abandoned_actions
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: array
    value: "[]"
  - name: incident_sys_id
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
  - name: environment_name
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
meta:
  version: 5
  layout: flow
  workerGroup: default
  description: Demo timing - starts IBM's Remediation_Master right after a ServiceNow
    approval (instead of +24 h) and re-scans the patched VM.
finally: null
