name: End-to-End-Automation
platform: node
blocks:
  - action: if
    name: environment_type_is_invalid
    condition: '["PROD", "DEV", "INT", "STAGE"].indexOf($environment_type) == -1'
    then:
      - action: assign
        name: Invalid_Environment_Type
        variable: $result
        value: '"environment_type must be one of PROD, DEV, INT, STAGE"'
      - action: exit
    else: []
  # Unique per run: <app>-<env>-<4 random [a-z0-9]>, e.g. robotshop-prod-a7f3.
  # Used as HCP workspace name, Terraform instance_name (-> AWX extra_vars,
  # Instana cluster name, Kubecost cluster id) and Concert environment +
  # credential name, so parallel deploys of the same app/env never collide.
  - action: assign
    name: build_deployment_id
    variable: $deployment_id
    value: '($app_name + "-" + $environment_type + "-" + Math.random().toString(36).substring(2, 6)).toLowerCase()'
  - action: if
    name: deployment_id_is_invalid
    condition: "$deployment_id.match(/^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$/) ? false : true"
    then:
      - action: assign
        name: Invalid_Deployment_Id
        variable: $result
        value: '"Generated deployment id is not a valid DNS label: " + $deployment_id'
      - action: exit
    else: []
  - action: ./Create_HCP_Terraform_Workspace
    name: Provision_with_Terraform
    inputs:
      - name: HCP_TERRAFORM_WORKSPACE_NAME
        value: $deployment_id
      - name: TERRAFORM_ENVIRONMENT_TYPE
        value: $environment_type
      - name: HCP_VAULT_AUTH_SECRET
        value: $vault_auth
      - name: service_type
        value: $service_type
      - name: feature_turbonomic
        value: $feature_turbonomic
      - name: feature_sevone
        value: $feature_sevone
      - name: feature_instana
        value: $feature_instana
      - name: feature_kubecost
        value: $feature_kubecost
      - name: ansible_app_name
        value: $app_name
      - name: ansible_remote_user
        value: $ssh_username
      - name: ansible_remote_port
        value: $port
      - name: cloud_provider
        value: $cloud_provider
  - action: ./HCP_Vault_Dedicated_Get_Secret
    name: get_ssh_private_key
    inputs:
      - name: secret_name
        value: '"ssh_private_key"'
      - name: HCP_AUTH_SECRET
        value: $vault_auth
  - action: ./HCP_Vault_Dedicated_Get_Secret
    name: get_aap_password
    inputs:
      - name: secret_name
        value: $aap_password_secret_name
      - name: HCP_AUTH_SECRET
        value: $vault_auth
  - action: ./HCP_Vault_Dedicated_Get_Secret
    name: get_aap_url
    inputs:
      - name: secret_name
        value: $aap_url_secret_name
      - name: HCP_AUTH_SECRET
        value: $vault_auth
  - name: AAP_Auth
    action: authOverride
    authentication: '"ibmconcert/awx"'
    override: "{\"host\":$get_aap_url.result,\"username\":\"admin\",\"password\":$get_aap_password.result}"
  - action: ./Update-Credential-By-Name
    name: Update_Default_Credential
    inputs:
      - name: auth
        value: $AAP_Auth.result
      - name: name
        value: '"Default"'
      - name: credential_data
        value: |-
          {
              "credential_type": 1,

              "inputs": {
                  "ssh_key_data": $get_ssh_private_key.result,
                  "username": $ssh_username
              },
              "name": "Default",
              "organization": 1
          }
  # Terraform's aap_job launches setup-ec2-instance-automated with
  # extra_vars.instance_name = deployment_id; this watches exactly that job.
  - action: ./AAP-watch-job-by-name
    name: Watch_Ansible_Job
    inputs:
      - name: aap_job_name
        value: '"setup-ec2-instance-automated"'
      - name: AAP_AUTH
        value: $AAP_Auth.result
      - name: instance_name
        value: $deployment_id
  - action: assign
    name: Assign_aap_artifacts
    variable: $aap_artifacts
    value: $Watch_Ansible_Job.output
  # $aap_artifacts.{k3s_endpoint,k3s_token,cluster_name,app_namespace} come
  # from ria-demo's setup_k3s.yaml set_stats. concert_core_url/concert_api_key
  # are synced into Vault by optimized-solution's post_config.yml.
  - action: if
    name: has_k3s_token
    condition: $aap_artifacts.k3s_token != null && $aap_artifacts.k3s_token != ""
    then:
      - action: ./HCP_Vault_Dedicated_Get_Secret
        name: get_concert_core_url
        inputs:
          - name: secret_name
            value: '"concert_core_url"'
          - name: HCP_AUTH_SECRET
            value: $vault_auth
      - action: ./HCP_Vault_Dedicated_Get_Secret
        name: get_concert_api_key
        inputs:
          - name: secret_name
            value: '"concert_api_key"'
          - name: HCP_AUTH_SECRET
            value: $vault_auth
      - action: ./Register-Concert-Kubernetes-Environment
        name: Register_Concert_Environment
        inputs:
          - name: concert_core_url
            value: $get_concert_core_url.result
          - name: concert_api_key
            value: $get_concert_api_key.result
          - name: deployment_id
            value: $deployment_id
          - name: environment_type
            value: $environment_type
          - name: app_name
            value: $app_name
          - name: app_namespace
            value: $aap_artifacts.app_namespace
          - name: k3s_endpoint
            value: $aap_artifacts.k3s_endpoint
          - name: k3s_token
            value: $aap_artifacts.k3s_token
          - name: cluster_name
            value: $aap_artifacts.cluster_name
    else: []
  - action: assign
    name: Assign_result
    variable: $result
    value: $Provision_with_Terraform.result
variables:
  - name: result
    required: false
    isInput: false
    isOutput: true
    level: INTERMEDIATE
    type:
      type: any
    value: '""'
  - name: deployment_id
    required: false
    isInput: false
    isOutput: true
    level: INTERMEDIATE
    type:
      type: string
    value: '""'
  - name: cloud_provider
    required: true
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '"AWS"'
  - name: environment_type
    required: true
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '"DEV"'
  - name: service_type
    required: false
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '"backend"'
  - name: app_name
    required: false
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '"robotshop"'
  - name: feature_kubecost
    required: false
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '"true"'
  - name: feature_instana
    required: false
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '"true"'
  - name: feature_sevone
    required: false
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '"false"'
  - name: feature_turbonomic
    required: false
    isInput: true
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '"true"'
  - name: aap_artifacts
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: object
    value: "{}"
  - name: vault_auth
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '"ibmconcert/vault"'
    meta:
      authType: ANY
      subType: authentication
  - name: aap_url_secret_name
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '"awx_url"'
  - name: aap_password_secret_name
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '"awx_admin_password"'
  - name: port
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '"22"'
  - name: ssh_username
    required: false
    isInput: false
    isOutput: false
    level: INTERMEDIATE
    type:
      type: string
    value: '"ubuntu"'
meta:
  workerGroup: default
  description: "End-to-End Automation: generate a unique deployment id\
    \ (<app>-<env>-<id>), provision the VM on AWS or Azure with HCP Terraform\
    \ (optionally sized by Turbonomic), configure it with Ansible via AWX\
    \ (k3s, demo app, Instana, Kubecost) and register it in IBM Concert with\
    \ its environment type (PROD/DEV/INT/STAGE) so CVE priorities reflect it."
  layout: flow
  version: 5
finally: null
